

<!DOCTYPE html>
<html>
<head>
    <title>Daily To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Daily To-Do List</h1>
        <p class="subtitle">Make your day productive ✨</p>

        <h3 id="date"></h3>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter your task...">
            <button onclick="addTask()">+ Add Task</button>
        </div>

        <div class="dashboard">

            <div class="card">
                <h2 id="total">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="card">
                <h2 id="completed">0</h2>
                <p>Completed</p>
            </div>

            <div class="card">
                <h2 id="pending">0</h2>
                <p>Pending</p>
            </div>

        </div>

        <div class="progress-box">

            <div class="progress-text">
                <span>Completion Progress</span>
                <span id="percent">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

        </div>

        <h2 class="task-heading">My Tasks</h2>

        <ul id="taskList"></ul>

        <p id="message">No tasks added yet!</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
